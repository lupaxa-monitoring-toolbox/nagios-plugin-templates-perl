name: Perl Linter

on:
  push:
    paths:
      - ".github/workflows/perl-linter.yml"
      - "**/*.pl"
      - "**/*.pm"

  pull_request:
    branches:
      - "master"
    paths:
      - ".github/workflows/perl-linter.yml"
      - "**/*.pl"
      - "**/*.pm"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  perl-linter:
    name: Perl Linter
    uses: the-lupaxa-project/workflows/.github/workflows/reusable-perl-linter.yml@master
    secrets: inherit

  generate-workflow-summary:
    name: Generate Workflow Summary
    needs:
      - perl-linter
    if: always()
    uses: the-lupaxa-project/workflows/.github/workflows/reusable-workflow-summary.yml@master

  generate-workflow-notifications:
    name: Generate Workflow Notifications
    needs:
      - generate-workflow-summary
    if: always()
    uses: the-lupaxa-project/workflows/.github/workflows/reusable-workflow-notifier.yml@master
    with:
      notify_on_results: "failure,timed_out"
    secrets:
      slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
